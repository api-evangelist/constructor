aid: constructor
name: Constructor
description: >-
  Constructor is an AI-powered ecommerce product discovery and search platform.
  Its Commerce Reasoning Engine interprets shopper behavior, context, and intent
  to personalize results across Autocomplete, Search (including Natural Language
  and Image Search), Browse, Recommendations, Quizzes, Collections, Retail Media
  (Sponsored Listings and Display Ads), and AI Shopping Agents. Retailers
  integrate over a REST API at ac.cnstrc.com plus first-party SDKs (JavaScript,
  Node, Python, Ruby, Java, .NET, Swift, Android) and React UI component
  libraries, manage catalogs and searchandising configuration, and track
  behavioral beacons. Constructor is a portfolio company of Sapphire Ventures.
